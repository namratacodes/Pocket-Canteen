services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: pc, POSTGRES_PASSWORD: pc, POSTGRES_DB: pocketcanteen }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U pc"], interval: 5s, retries: 10 }
  backend:
    build: ./apps/backend
    env_file: ./apps/backend/.env
    environment: { DATABASE_URL: "postgresql://pc:pc@postgres:5432/pocketcanteen" }
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["4000:4000"]
    command: sh -c "npx prisma db push --skip-generate && npx prisma db execute --file prisma/constraints.sql --schema prisma/schema.prisma && node dist/server.js"
  # Optional ML service: uncomment only if apps/ml-service exists (then set ML_SERVICE_URL=http://ml-service:8000 in apps/backend/.env)
  # ml-service:
  #   build: ./apps/ml-service
  #   ports: ["8000:8000"]
volumes: { pgdata: {} }
